version: 1
providers:
  gemai_image:
    adapter: openai-compatible
    base_url: https://api.gemai.cc/v1
    model: [福利]gemini-3.5-flash
    credential_ref: gemai
    api_key_env: GEMAI_API_KEY
    declared_capabilities:
      image: true
    adapter_options:
      endpoint_path: /chat/completions
      media_part_mode: image_url_data_uri
  gemai_audio:
    adapter: openai-compatible
    base_url: https://api.gemai.cc/v1
    model: [福利]gemini-3.5-flash
    credential_ref: gemai
    api_key_env: GEMAI_API_KEY
    declared_capabilities:
      audio: true
      music: true
      video_audio: true
    adapter_options:
      endpoint_path: /chat/completions
      media_part_mode: input_audio_base64
routes:
  image:
    primary: gemai_image
  audio:
    primary: gemai_audio
  music:
    primary: gemai_audio
  video_audio:
    primary: gemai_audio
